[project]
name = "deep-isochron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joon-Hyuk Ko", email = "jhko725@kias.re.kr" }
]
requires-python = ">=3.13"
dependencies = [
    "diffrax>=0.7.2",
    "einops>=0.8.2",
    "equinox>=0.13.8",
    "hydra-core>=1.3.4",
    "ipykernel>=7.3.0",
    "jax[cuda12]>=0.10.2",
    "jaxtyping>=0.3.11",
    "matplotlib>=3.11.0",
    "numpy>=2.5.1",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.4",
    "quax>=0.3.7",
    "wandb>=0.28.0",
]

[project.scripts]
deep-isochron = "deep_isochron:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-include = ["*.ipynb"]
src = []
fix = true

[tool.ruff.lint]
fixable = ["I001", "F401"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
order-by-type = false
