# Phase D6. Three jobs, each a sequence of `just` recipes from the justfile, so that a
# command list is written once and CI runs what a developer runs: `checks` (the hooks of
# prek.toml, ty, and the quick suite at the hypothesis `ci` profile), `slow` (the slow
# tier and a 20-step end-to-end run on a tiny Bautin dataset, CPU), and `auto` (AUTO-07p
# built at the pinned commit, then the tests that run it). ty runs as `uvx ty@latest`
# on purpose: the checker is young and its rules grow, and we want the code clean
# against the newest one. The local `just check` uses the pinned dev-group copy; when
# CI goes red on a rule the local run does not show, `uv lock --upgrade-package ty` and
# fix forward.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  JAX_PLATFORMS: cpu
  PYTHONUNBUFFERED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      # JAX's persistent compilation cache, which tests/conftest.py turns on at
      # ~/.cache/jax: the key ends in the commit so that every run saves what it
      # compiled, and the restore prefix takes the latest run under the same lock file.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jax
          key: jax-${{ github.job }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: jax-${{ github.job }}-${{ hashFiles('uv.lock') }}-
      - run: uv run just check "uvx ty@latest"
      - run: uv run just test ci

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      # gfortran compiles the generated AUTO Fortran in tests/test_auto_codegen.py;
      # installed explicitly rather than relying on the runner image.
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jax
          key: jax-${{ github.job }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: jax-${{ github.job }}-${{ hashFiles('uv.lock') }}-
      - run: uv run just test-slow ci
      - run: uv run just smoke

  # AUTO-07p: the Fortran tree is built at the commit uv.lock pins and cached under it,
  # so a second run skips the build; then the tests that carry the `auto` marker.
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - run: sudo apt-get update && sudo apt-get install -y gfortran make
      - id: pin
        run: echo "commit=$(scripts/install_auto.sh --commit)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/opt/auto-07p
          key: auto-07p-${{ runner.os }}-${{ steps.pin.outputs.commit }}
      - run: uv run just install-auto
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jax
          key: jax-${{ github.job }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: jax-${{ github.job }}-${{ hashFiles('uv.lock') }}-
      # CI runs on pull requests and on master only, so it runs the full oracle suite
      - run: uv run just test-auto full
