# Trajectories from the FitzHugh–Nagumo system, discussed in P. Langfield et al. Commun. Nonlinear Sci. Numer. Simulat. 151, 109043 (2025).
# Default is 500 initial conditions in a box, 50 time units.
# Run: uv run python scripts/generate_data.py --config-name fhn-easy  [key=value overrides]
name: fitzhugh_nagumo_easy
out_dir: data
seed: 0
n_trajectories: 500

system:
  _target_: deep_isochron.systems.FitzhughNagumo
  a: 0.7
  b: 0.8
  c: 1.0      # Langfield et al. 2025 §4.2: "c = 1 with practically no time-scale separation"
  z: -0.8     # "z = −0.8 so that the equilibrium is shifted": a repelling focus at ≈ (0.2729, 0.5339),
              # period ≈ 10.8329, clockwise; the phaseless set is that single point

ic_sampler:
  _target_: deep_isochron.data.UniformBox
  lo: [-3.0, -3.0]
  hi: [3.0, 3.0]

time:
  t0: 0.0
  t1: 50.0
  n: 501

solver:
  _target_: deep_isochron.systems.SolverConfig
  solver:
    _target_: diffrax.Tsit5
  rtol: 1.0e-8
  atol: 1.0e-10
  max_steps: 65536

outside_basin: error   # initial conditions in a phaseless set: error | resample (ADR-0013)
integration: null  # AbstractNormalForm systems only
